<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1945 - Tenkai Example</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0b1a2b;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Scale the 600x800 canvas to fit the window, keeping its aspect ratio and hard pixel edges */
    canvas.gamescreen {
      display: block;
      height: min(100vh, 800px, 133.33vw);
      width: auto;
      aspect-ratio: 3 / 4;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <div id="game" width="600" height="800"></div>
  <script src="bundle.js"></script>
</body>
</html>
